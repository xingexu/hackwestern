# agentkit: one way to prove changes work, the same in every repo.

[verify]
# `agentkit verify` runs these in order and stops at the first failure. Keep them under a minute or two.
fast = ["node web/dev/verify_camera_collision.mjs", ".venv/bin/python build/compile_buildings.py", ".venv/bin/python build/validate_specs.py", "node web/dev/verify_building_forms.mjs", "node web/dev/verify_survey_structures.mjs", "node web/dev/verify_contact_shapes.mjs", "node web/dev/verify_building_finishes.mjs", "node web/building-fidelity.test.mjs", ".venv/bin/python build/check_building_registration.py", "node web/dev/verify_light_space.mjs", "cd build && ../.venv/bin/python voxelize.py", "cd build && ../.venv/bin/python check_world.py", "cd build && ../.venv/bin/python check_landmarks.py", "cd build && ../.venv/bin/python drive_route.py", "cd build && ../.venv/bin/python street_detail.py", "cd build && ../.venv/bin/python campus_region.py --check", "cd build && ../.venv/bin/python drive_network.py --check", "cd build && ../.venv/bin/python region_detail.py --check", "cd build && ../.venv/bin/python surface_tiles.py --check", "cd web && node dev/verify_drive_sim.mjs", "cd web && node dev/verify_circuits.mjs", "cd web && node dev/verify_network.mjs", "cd build && ../.venv/bin/python canopy_survey.py --check", "cd build && ../.venv/bin/python municipal_detail.py --check", "cd web && node dev/verify_landscape.mjs", "cd web && node dev/verify_pacing.mjs", "cd web && node dev/verify_scene_pack.mjs", "cd web && node dev/verify_bridges.mjs", "cd build && ../.venv/bin/python street_finishes.py --check", "cd web && node dev/verify_finish_geometry.mjs", "cd build && ../.venv/bin/python check_land_paint.py", "cd web && node dev/verify_building_access.mjs", "cd web && node dev/verify_horizon.mjs", "cd build && ../.venv/bin/python driving_horizon.py --check", "cd build && ../.venv/bin/python street_projection.py --check", "cd build && ../.venv/bin/python streetview_facades.py --check", ".venv/bin/python build/streetview_pose.py --check", "cd build && ../.venv/bin/python streetview_materials.py --check", "cd web && node dev/verify_facade_relief.mjs", ".venv/bin/python build/campus_bounds.py --check", "cd build && ../.venv/bin/python streetview_signs.py --check", "node web/dev/race_version.mjs", "node web/dev/verify_replay.mjs", ".venv/bin/python build/check_ground_observations.py"]
# `agentkit verify full` runs fast, then these: builds and end-to-end journeys.
# Add the driver from pstack's create-verification-skill here.
full = [".venv/bin/python build/check_building_preview.py", "cd web && node build_single.mjs", "cd web && node build_single.mjs --drive", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/verify_browser.mjs --world-dir . --standalone dist/campus.html --shot-prefix campus'", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/verify_drive.mjs'", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/verify_roam.mjs'", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/verify_region_detail.mjs'", "npm run build", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/verify_hosted.mjs'", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/verify_campus_clip.mjs'", "node web/dev/verify_race_engines.mjs", "node web/dev/verify_trial_board.mjs", "node build/race_build.mjs --check", "node web/dev/verify_trial_phone.mjs", "cd web && npm exec --yes --package=playwright@1.65.1 -c 'node dev/survey_land.mjs land-after --prove'", "npm exec --yes --package=playwright@1.65.1 -c 'node web/dev/verify_look.mjs'", "node server/verify-online.mjs", "node web/dev/audit/smoke.mjs", "node web/dev/verify_surface_rendering.mjs", "node web/dev/verify_ground_contacts.mjs"]
# Each command is killed after this many seconds, so a hanging test cannot stall an agent.
timeout_s = 600
# Changes only under these paths do not need re-verification.
ignore = ["*.md", "docs/**"]
# The global stop hook blocks an agent from ending a turn that changed code here
# until `agentkit verify` has passed on exactly the current code.
require_before_done = true

